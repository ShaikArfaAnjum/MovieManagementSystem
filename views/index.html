<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Management System</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="index.html" class="brand-title">🎬 Movie Management</a>
        <button id="addMovieBtn" class="btn btn-primary">+ Add Movie</button>
    </header>

    <!-- Search, Filter & Sort Controls -->
    <div class="controls-container">
        <!-- Search Bar -->
        <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search movie by title..."
        >

        <!-- Genre Filter -->
        <select id="genreFilter" class="filter-select">
            <option value="All">All Genres</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Romance">Romance</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Thriller">Thriller</option>
        </select>

        <!-- Language Filter -->
        <select id="languageFilter" class="filter-select">
            <option value="All">All Languages</option>
            <option value="Hindi">Hindi</option>
            <option value="Telugu">Telugu</option>
            <option value="English">English</option>
            <option value="Tamil">Tamil</option>
        </select>

        <!-- Sort by Rating / Year -->
        <select id="sortFilter" class="filter-select">
            <option value="default">Sort By</option>
            <option value="rating-desc">Rating: High to Low</option>
            <option value="rating-asc">Rating: Low to High</option>
            <option value="year-desc">Year: Newest First</option>
            <option value="year-asc">Year: Oldest First</option>
        </select>

        <!-- Favourite Filter -->
        <select id="favouriteFilter" class="filter-select">
            <option value="all">All Movies</option>
            <option value="fav">Favourites Only (♥)</option>
        </select>
    </div>

    <!-- Movie Count Display -->
    <div class="movie-count">
        Showing <span id="moviesCount" style="color:#f5c518; font-weight:bold;">0</span> movies
    </div>

    <!-- Movie Cards Grid -->
    <div id="moviesGrid" class="movies-grid">
        <!-- Movies injected dynamically by main.js -->
    </div>

    <!-- Add / Edit Movie Modal Form -->
    <div id="movieModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Movie</h2>
                <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
            </div>

            <form id="movieForm">
                <!-- Hidden input to store movie ID when updating -->
                <input type="hidden" id="movieId">

                <div class="form-group">
                    <label for="movieTitle">Movie Title *</label>
                    <input type="text" id="movieTitle" class="form-input" placeholder="e.g. 3 Idiots" required>
                </div>

                <div class="form-group">
                    <label for="movieGenre">Genre *</label>
                    <select id="movieGenre" class="form-input" required>
                        <option value="">Select Genre</option>
                        <option value="Action">Action</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Drama">Drama</option>
                        <option value="Romance">Romance</option>
                        <option value="Sci-Fi">Sci-Fi</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Thriller">Thriller</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="movieLanguage">Language *</label>
                    <select id="movieLanguage" class="form-input" required>
                        <option value="">Select Language</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Telugu">Telugu</option>
                        <option value="English">English</option>
                        <option value="Tamil">Tamil</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="movieYear">Release Year *</label>
                    <input type="number" id="movieYear" class="form-input" placeholder="e.g. 2009" min="1900" max="2035" required>
                </div>

                <div class="form-group">
                    <label for="movieRating">Rating (0 - 10) *</label>
                    <input type="number" id="movieRating" class="form-input" placeholder="e.g. 8.4" step="0.1" min="0" max="10" required>
                </div>

                <div class="form-group">
                    <label for="movieDuration">Duration *</label>
                    <input type="text" id="movieDuration" class="form-input" placeholder="e.g. 170 min" required>
                </div>

                <div class="form-group">
                    <label for="moviePoster">Poster Image Path</label>
                    <input type="text" id="moviePoster" class="form-input" placeholder="e.g. ../assets/posters/3idiots.jpg">
                </div>

                <div class="form-group">
                    <label for="movieDescription">Description / Plot *</label>
                    <textarea id="movieDescription" class="form-input" rows="3" placeholder="Short summary of the movie..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="saveMovieBtn" class="btn btn-primary">Save Movie</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toastNotification" class="toast"></div>

    <!-- Axios from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JavaScript Modules -->
    <script src="../js/service/apiConfig.js"></script>
    <script src="../js/service/movieService.js"></script>
    <script src="../exception/validationException.js"></script>
    <script src="../exception/apiException.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
